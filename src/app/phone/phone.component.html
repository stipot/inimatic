<ion-header [translucent]="true">
	<ion-toolbar>
		<ion-title> INIMATIC |
			<ion-button routerLink="/#follower" *ngIf="isInitiator" size="small">Phone page</ion-button>
			<ion-button routerLink="/" *ngIf="!isInitiator" size="small">PC page</ion-button>
		</ion-title>
	</ion-toolbar>
</ion-header>


<ion-content [fullscreen]="true">
	<!-- <ion-header collapse="condense">
		<ion-toolbar>
			<ion-title size="large">Blank</ion-title>
		</ion-toolbar>
	</ion-header> -->

	<div id="initiator_container" *ngIf="isInitiator">
		<div class="instruction" *ngIf="!isConnected()">
			<div>
				<strong>1. Open Inimatic application on your phone</strong>
				<p>and point it to the screen</p>
			</div>
			<p>{{sessionID}}</p>
			<qrcode [qrdata]="sessionID" [width]="256" [errorCorrectionLevel]="'M'" *ngIf="sessionID!='-'"></qrcode>
		</div>
	</div>

	<div id="follower_container" *ngIf="!isInitiator">
		<div *ngIf="!isConnected()">
			<!-- Fallback for iOS PWA -->
			<input #fileinput type="file" accept="image/*;capture=camera" hidden (change)="handleFile($event)" />

			<!-- Trigger the file input -->
			<ion-button expand="full" (click)="captureImage()">
				<ion-icon slot="start" name="camera"></ion-icon>
				Capture Image
			</ion-button>

			<ion-button expand="full" (click)="startScan()">
				<ion-icon slot="start" name="qr-scanner"></ion-icon>
				Start scan
			</ion-button>

			<ion-button expand="full" (click)="reset()" color="warning" *ngIf="scanResult">
				<ion-icon slot="start" name="refresh"></ion-icon>
				Reset
			</ion-button>

			<!-- Shows our camera stream -->
			<video #video width="30%"></video>

			<!-- Used to render the camera stream images -->
			<canvas #canvas></canvas>

			<!-- Stop our scanner preview if active -->
			<ion-button expand="full" (click)="stopScan()" color="danger">
				<ion-icon slot="start" name="close"></ion-icon>
				Stop scan
			</ion-button>
		</div>

		<!-- <div>
			<input
				type="text"
				[(ngModel)]="sessionID"
				placeholder="sessionID"
			/>
			<button (click)="connectToSession()" style="padding: 5px">
				Connect
			</button>
		</div> -->
	</div>

	<div class="connected_stage" *ngIf="isConnected()">
		<h2>Connected</h2>
		<div class="transfer_file_form_wrapper">
			<!-- <form class="transfer_file_form">
				<input type="file" (change)="uploadFile($event)" />
				<button type="submit" (click)="transferFile()">
					Transfer file
				</button>
			</form> -->
		</div>

		<div>
			<input type="text" [(ngModel)]="message" />
			<button (click)="send()">Send Message</button>
		</div>
	</div>
</ion-content>
