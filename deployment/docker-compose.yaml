# docker-compose.yaml
services:
    init-dhparams:
        image: docker.io/certbot/certbot
        restart: "no"
        entrypoint: /bin/sh
        command: -c 'test -f /etc/letsencrypt/ssl-dhparams.pem || openssl dhparam -out /etc/letsencrypt/ssl-dhparams.pem 4096'
        volumes:
            - cert_volume:/etc/letsencrypt
    certbot-oneshot:
        image: docker.io/certbot/certbot
        restart: "no"
        entrypoint: /bin/sh
        env_file:
            - ./deployment/.env
        command: -c 'test -d /etc/letsencrypt/live/${STAND:-dev99}.${BASE_DOMAIN:-example.ru} || certbot certonly --webroot -w /usr/share/nginx/html -d "${STAND:-dev99}.${BASE_DOMAIN:-example.ru},sub1.${STAND:-dev99}.${BASE_DOMAIN:-example.ru}" --rsa-key-size ${rsa_key_size:-2048} --agree-tos --force-renewal  --register-unsafely-without-email'
        ports:
            - 80:80
        volumes:
            - cert_volume:/etc/letsencrypt
            - acme_challenge:/usr/share/nginx/html
    nginx:
        image: docker.io/library/nginx
        entrypoint: /bin/sh
        command: -c 'while :; do sleep 6h && wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'
        configs:
            - source: nginx-defaultserver
              target: /etc/nginx/conf.d/default.conf
        ports:
            - 80:80
            - 443:443
        depends_on:
            init-dhparams:
                condition: service_completed_successfully
                required: true
            certbot-oneshot:
                condition: service_completed_successfully
                required: true
        volumes:
            - cert_volume:/etc/letsencrypt:Z
            - acme_challenge:/usr/share/nginx/html/.well-known:Z
    frontend:
        depends_on:
            - certbot-oneshot
            - backend
        build:
            context: .
            dockerfile: ./deployment/frontend.Dockerfile
        restart: always
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - cert_volume:/etc/letsencrypt
            - acme_challenge:/usr/share/nginx/html/.well-known
        configs:
            - source: nginx-defaultserver
              target: /etc/nginx/conf.d/default.conf

    backend:
        depends_on:
            redis:
                condition: service_healthy
        build:
            context: .
            dockerfile: ./deployment/backend.Dockerfile
        restart: always

    redis:
        image: redis:latest
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 1s
            timeout: 3s
            retries: 5
        command: ["redis-server"]

    certbot:
        image: docker.io/certbot/certbot
        entrypoint: /bin/sh
        command: >-
            -c 'trap exit TERM; while :; do certbot renew --webroot -w /usr/share/nginx/html;
            sleep 12h && wait $${!}; done;'
        env_file:
            - ./deployment/.env
        volumes:
            - cert_volume:/etc/letsencrypt
            - acme_challenge:/usr/share/nginx/html

volumes:
    cert_volume: {}
    acme_challenge: {}

configs:
    nginx-defaultserver:
        content: |
            upstream backend {
              server backend:3030;
            }

            server {
              server_name inimatic.com;
              listen 443 ssl http2;

              ssl_certificate     /etc/letsencrypt/live/${STAND:-dev99}.${BASE_DOMAIN:-example.ru}/cert.pem;
              ssl_certificate_key /etc/letsencrypt/live/${STAND:-dev99}.${BASE_DOMAIN:-example.ru}/key.pem;

              location / {
                proxy_pass http://backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
              }

              location /.well-known/acme-challenge/ {
                root /usr/share/nginx/html;
                allow all;
              }
            }

            server {
              listen 80;
              server_name inimatic.com;
              charset utf-8;
              client_max_body_size 10M;
              root /usr/share/nginx/html;
              index index.html index.htm;

              location / {
                try_files $uri $uri/ =404;
              }

              location /.well-known/acme-challenge/ {
                root /usr/share/nginx/html;
                allow all;
              }

              error_page 500 502 503 504 /502.html;
              location = /502.html {
                internal;
              }
            }
