# docker-compose.yaml
services:
    init-dhparams:
        image: docker.io/certbot/certbot
        restart: "no"
        entrypoint: /bin/sh
        command: -c 'test -f /etc/letsencrypt/ssl-dhparams.pem || openssl dhparam -out /etc/letsencrypt/ssl-dhparams.pem 4096'
        volumes:
            - cert_volume:/etc/letsencrypt
        deploy:
            replicas: ${BUILD_SSL:+1}
    certbot-oneshot:
        image: docker.io/certbot/certbot
        restart: "no"
        entrypoint: /bin/sh
        command: -c 'test -d /etc/letsencrypt/live/${BASE_DOMAIN:-example.ru} || certbot certonly --webroot -w /usr/share/nginx/html -d "${BASE_DOMAIN:-example.ru}" --rsa-key-size ${rsa_key_size:-2048} --agree-tos --force-renewal --register-unsafely-without-email'
        ports:
            - 80:80
        volumes:
            - cert_volume:/etc/letsencrypt
            - acme_challenge:/usr/share/nginx/html
        deploy:
            replicas: ${BUILD_SSL:+1}
    frontend:
        depends_on:
            backend:
                condition: service_started
        build:
            context: .
            dockerfile: ./deployment/frontend.Dockerfile
            args:
                BUILD_SCRIPT: ${BUILD_SCRIPT}
                BASE_DOMAIN: ${BASE_DOMAIN}
        restart: always
        environment:
            - BUILD_SCRIPT=${BUILD_SCRIPT}
        ports:
            - "80:80"
            - "3000:3000"
            - "443:443"
        volumes:
            - cert_volume:/etc/letsencrypt:Z
            - acme_challenge:/usr/share/nginx/html/.well-known:Z
        configs:
            - source: nginx-prod-server
              target: /etc/nginx/conf.d/default.conf

    backend:
        depends_on:
            redis:
                condition: service_healthy
        build:
            context: .
            dockerfile: ./deployment/backend.Dockerfile
        restart: always

    redis:
        image: redis:latest
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 1s
            timeout: 3s
            retries: 5
        command: ["redis-server"]

volumes:
    cert_volume: {}
    acme_challenge: {}

configs:
    nginx-prod-server:
        content: |
            upstream backend {
              server backend:3030;
            }

            server {
              listen 80;
              server_name ${BASE_DOMAIN:-127.0.0.2};
              charset utf-8;
              client_max_body_size 10M;
              root /usr/share/nginx/html;
              index index.html index.htm;

              location /.well-known/acme-challenge/ {
                root /usr/share/nginx/html;
                allow all;
              }

              location / {
                try_files $$uri $$uri/ /index.html;
              }

              error_page 500 502 503 504 /502.html;
              location = /50x.html {
                internal;
              }
            }
            server {
                listen 3000;
                server_name ${BASE_DOMAIN:-127.0.0.2};
                location / {
                    proxy_pass http://backend;
                    proxy_set_header Host $$host;
                    proxy_set_header X-Real-IP $$remote_addr;
                    proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $$scheme;
                }
            }
